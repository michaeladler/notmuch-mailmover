[workspace]
resolver = "2"
members = ["lib"]

[package]
name = "notmuch-mailmover"
version = "0.8.0"
authors = ["Michael Adler <therisen06@gmail.com>"]
description = "Move notmuch tagged mails into Maildir folders"
homepage = "https://github.com/michaeladler/notmuch-mailmover"
license = "Apache-2.0"
edition = "2024"

[[bin]]
name = "notmuch-mailmover"
path = "src/main.rs"

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

[dependencies]
notmuch-mailmover-lib = { version = "0.8.0", path = "lib" }
anyhow = "1.0.98"
env_logger = "0.11.8"
log = "0.4.27"
notmuch = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
yaml_serde = "0.10"
directories = "6.0.0"
shellexpand = "3.1.1"
clap = { version = "4.5.37", features = [ "derive", "cargo" ] }
git-version = "0.3.9"
konst = "0.4"
mlua = { version = "0.11.0", features = ["lua54", "serialize", "send"] }

[build-dependencies]
clap = { version = "4.5.37", features = [ "derive", "cargo" ] }
clap_complete = "4.5.48"
clap_mangen = "0.3.0"
git-version = "0.3.9"
flate2 = "1.0.17"
konst = "0.4"

[features]
vendored = ["mlua/vendored"]
