[workspace]
resolver = "2"
members = ["lib"]

[package]
name = "notmuch-mailmover"
version = "0.8.0"
authors = ["Michael Adler <therisen06@gmail.com>"]
description = "Move notmuch tagged mails into Maildir folders"
homepage = "https://github.com/michaeladler/notmuch-mailmover"
license = "Apache-2.0"
edition = "2024"

[[bin]]
name = "notmuch-mailmover"
path = "src/main.rs"

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
strip = true
opt-level = "s"

[dependencies]
notmuch-mailmover-lib = { version = "0.8.0", path = "lib" }
anyhow = "1.0.98"
env_logger = { version = "0.11.8", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4.27"
notmuch = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
yaml_serde = "0.10"
directories = "6.0.0"
shellexpand = "3.1.1"
git-version = "0.3.9"
konst = "0.4"
mlua = { version = "0.11.0", features = ["lua54", "serialize", "send"], optional = true }
argh = "0.1.19"

[features]
default = ["lua"]
lua = ["dep:mlua"]
vendored = ["lua", "mlua/vendored"]
