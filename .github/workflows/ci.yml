name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: michaeladler
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check -L --keep-going --show-trace
      # my-crate is already built by flake check, so this is a cache hit.
      - run: nix build .#my-crate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notmuch-mailmover
          path: result/bin/notmuch-mailmover

# `nix flake check` above already runs the integration tests; they run again
  # here to get coverage numbers.
  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
      - name: Generate code coverage
        # The devShell carries the toolchain and every build and test dependency.
        run: nix develop --command cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
