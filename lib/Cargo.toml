[package]
name = "notmuch-mailmover-lib"
version = "0.8.0"
authors = ["Michael Adler <therisen06@gmail.com>"]
description = "Rule engine and file mover for notmuch tagged mails"
homepage = "https://github.com/michaeladler/notmuch-mailmover"
license = "Apache-2.0"
edition = "2024"

[lib]
name = "nm_mailmover"
path = "src/mod.rs"

[dependencies]
uuid = { version = "1.16.0", features = ["v4"] }
anyhow = "1.0.98"
log = "0.4.27"
notmuch = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
